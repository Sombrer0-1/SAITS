# ========================================
# SAITS 预测任务配置文件
# 数据集: PhysioNet-2012
# 任务: 时间序列预测 (Forecasting)
# ========================================

[file_path]
# 数据集根目录
dataset_base_dir = generated_datasets

# 结果保存根目录
result_saving_base_dir = FORECAST_results


[dataset]
# 数据集名称 (与 generated_datasets 下的文件夹名对应)
dataset_name = physio2012_37feats_01masked

# 时间序列长度设置
# 使用前36步作为历史 (输入)
history_len = 36
# 预测未来12步 (输出)
forecast_horizon = 12

# 训练参数
batch_size = 64
num_workers = 4
eval_every_n_steps = 100

# 数据集特征数
feature_num = 37

# 滑动窗口步长
# stride=1: 最密集采样,样本最多但可能过拟合
# stride=6: 适中,推荐值
# stride=12: 稀疏采样,样本少但泛化能力强
stride = 6

# 是否处理缺失值
# True: 数据加载器返回 (history, missing_mask, future)
# False: 数据加载器返回 (history, future)
handle_missing = True


[training]
# 优化器设置
optimizer_type = adam
lr = 0.0005
weight_decay = 0.0001

# 训练轮数
epochs = 100

# 早停
early_stop_patience = 20

# 设备
device = cuda

# 梯度裁剪 (0表示不裁剪)
max_norm = 1.0

# 模型保存策略
# "best": 只保存最佳模型
# "all": 保存所有验证过的模型
# "none": 不保存模型
model_saving_strategy = best


[model]
# 模型名称 (用于结果保存路径)
model_name = PhysioNet2012_Forecast_SAITS

# 模型类型
# SAITS_Forecaster: 基础版 (单任务预测)
# SAITS_Forecaster_V2: 增强版 (双任务: 重建+预测)
model_type = SAITS_Forecaster

# SAITS 编码器参数 (复用自原始 SAITS)
n_groups = 2
n_group_inner_layers = 2
param_sharing_strategy = inner_group
input_with_mask = True
diagonal_attention_mask = True

# Transformer 参数
d_model = 256
d_inner = 128
n_head = 4
d_k = 64
d_v = 64
dropout = 0.1

# V2 模型特有参数 (仅当 model_type=SAITS_Forecaster_V2 时有效)
reconstruction_weight = 0.3
forecast_weight = 1.0


[test]
# 测试模式配置
# 训练后模型的路径 (需要手动修改为实际路径)
model_path = FORECAST_results/PhysioNet2012_Forecast_SAITS/models/2026-01-19_T10_30_00/model_trainStep_1000_valStep_10_MAE_0.1500.pth

# 结果保存路径
result_saving_path = FORECAST_results/PhysioNet2012_Forecast_SAITS/test_results


# ========================================
# 配置说明
# ========================================
#
# 1. 数据流程:
#    原始数据 [n_samples, 48, 37]
#    → 滑动窗口切分
#    → 历史 [batch, 36, 37] + 未来 [batch, 12, 37]
#
# 2. 模型架构:
#    历史 → [SAITS Encoder] → 编码表示 → [Projection Head] → 未来预测
#           ↑ 复用原始SAITS             ↑ 新增
#
# 3. 训练命令:
#    python run_forecast.py --config_path configs/PhysioNet2012_Forecast.ini
#
# 4. 测试命令:
#    python run_forecast.py --config_path configs/PhysioNet2012_Forecast.ini --test_mode
#
# 5. 超参数调优建议:
#    - history_len: 24~48 (取决于数据周期性)
#    - forecast_horizon: 6~24 (预测越长越难)
#    - d_model: 128~512 (越大参数越多)
#    - stride: 1~12 (影响样本数量)
#
# ========================================
